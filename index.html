<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT 10 - Weather Instrument Finder</title>
    
    <!-- Bootstrap 5 & Google Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    
    <style>
        body {
            background-image: url('https://i.pinimg.com/736x/a5/c7/bd/a5c7bd9542d3c4a2f6258d4a41c3c506.jpg');
            background-color: #ffdeeb;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Poppins', sans-serif;
            color: #4a4a4a;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .page-title {
            color: #d81b60;
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px #ffffff;
            margin-bottom: 10px;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 3px solid #f48fb1;
            box-shadow: 0 15px 35px rgba(236, 64, 122, 0.2);
            border-radius: 22px;
            max-width: 580px;
            width: 100%;
            margin: 20px auto;
            padding: 32px;
        }

        .header-box {
            background: linear-gradient(135deg, #f06292, #ec407a);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 24px;
            box-shadow: 0 6px 15px rgba(236, 64, 122, 0.3);
        }

        .form-control {
            border: 2px solid #f8bbd0;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 1rem;
            transition: all 0.25s ease;
        }

        .form-control:focus {
            border-color: #ec407a;
            box-shadow: 0 0 0 0.25rem rgba(236, 64, 122, 0.2);
        }

        .btn-custom {
            background: linear-gradient(135deg, #f48fb1, #ec407a);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-custom:hover {
            background: linear-gradient(135deg, #ec407a, #d81b60);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(236, 64, 122, 0.35);
        }

        .btn-custom:active {
            transform: translateY(0);
        }

        .result-panel {
            background-color: #fff9fb;
            border: 2px dashed #f48fb1;
            border-radius: 16px;
            padding: 22px;
            margin-top: 24px;
            text-align: left;
        }

        .result-title {
            color: #ec407a;
            font-weight: 700;
            font-size: 1.1rem;
            border-bottom: 2px solid #fce4ec;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .detail-row {
            background: #ffffff;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid #f48fb1;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
        }

        .detail-row:last-child {
            margin-bottom: 0;
        }

        .detail-label {
            color: #ad1457;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
        }

        .detail-value {
            color: #333333;
            font-weight: 600;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="container py-4 text-center">
        <h1 class="page-title">PRACTICE SET</h1>
        
        <div class="main-card">
            <div class="header-box text-center">
                <h2 class="mb-1 fw-bold">Weather Instruments</h2>
                <small class="text-white-50">Meteorological Tool Lookup</small>
            </div>

            <!-- Input Field -->
            <div class="mb-3 text-start">
                <label for="weather_instruments" class="form-label fw-bold text-secondary">Instrument Name</label>
                <input type="text" id="weather_instruments" class="form-control bg-white" placeholder="e.g., Thermometer, Barometer, Rain Gauge..." autocomplete="off">
            </div>

            <!-- Search Button -->
            <button py-click="Search_Element" class="btn btn-custom w-100 shadow-sm">Check Details</button>

            <!-- Results Panel -->
            <div class="result-panel shadow-sm">
                <h4 class="result-title">Search Results</h4>
                
                <div class="detail-row">
                    <span class="detail-label">Instrument</span>
                    <span id="instruments" class="detail-value">-</span>
                </div>

                <div class="detail-row">
                    <span class="detail-label">Measures</span>
                    <span id="measures" class="detail-value">-</span>
                </div>

                <div class="detail-row">
                    <span class="detail-label">Unit of Measurement</span>
                    <span id="unit-of-measurement" class="detail-value">-</span>
                </div>

                <div class="detail-row">
                    <span class="detail-label">Purpose</span>
                    <span id="purpose" class="detail-value">-</span>
                </div>
            </div>
        </div>
    </div>

    <script type="py" src="main.py"></script>

</body>
</html>
